<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How Loud Am I</title>
<style>
:root{color-scheme:dark light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.5rem;text-align:center;padding:1.5rem;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:#0b0f14;color:#eaf2f8;
  transition:background .4s;
}
@media (prefers-color-scheme: light){
  body{background:#f4f8fb;color:#0b0f14}
}
#num{
  font-size:min(24vw,13rem);font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  user-select:none;
  background:linear-gradient(180deg,#ffe08e,#ffb84f);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
@media (prefers-color-scheme: light){
  #num{background:linear-gradient(180deg,#d68f1a,#915a0b);-webkit-background-clip:text;background-clip:text}
}
#unit{font-size:1.3rem;opacity:.6}
#peak{font-size:1rem;opacity:.55;cursor:pointer;user-select:none;margin-top:.25rem;min-height:1.3em}
#acc{font-size:.85rem;opacity:.4;min-height:1.2em}
#msg{font-size:1rem;opacity:.7;max-width:26rem}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
#start{
  margin-top:.5rem;padding:.6rem 1.4rem;border-radius:2rem;
  border:1px solid currentColor;background:transparent;color:inherit;
  font-size:1rem;cursor:pointer;opacity:.85;
}
#start:active{opacity:.5}
</style>
</head>
<body>
<div id="num">--</div>
<div id="unit">dB</div>
<div id="peak"></div>
<div id="acc"></div>
<div id="msg"></div>
<button id="start" type="button">Enable Microphone</button>
<script>
var lastDb=null,peakDb=null,lastFrame=0,audioCtx,analyser,dataArr,
    numEl=document.getElementById("num"),unitEl=document.getElementById("unit"),
    peakEl=document.getElementById("peak"),accEl=document.getElementById("acc"),
    msgEl=document.getElementById("msg"),startBtn=document.getElementById("start");

try{var sp=localStorage.getItem("peakDb");if(sp!=null)peakDb=parseFloat(sp);}catch(e){}

function render(){
  if(lastDb==null)return;
  numEl.textContent=Math.round(lastDb);
  renderPeak();
}
function renderPeak(){
  peakEl.textContent=peakDb==null?"":"peak "+Math.round(peakDb)+" dB — tap to reset";
}
peakEl.onclick=function(){
  peakDb=null;
  try{localStorage.removeItem("peakDb")}catch(e){}
  renderPeak();
};
renderPeak();

function loop(){
  requestAnimationFrame(loop);
  analyser.getFloatTimeDomainData(dataArr);
  var sum=0;
  for(var i=0;i<dataArr.length;i++)sum+=dataArr[i]*dataArr[i];
  var rms=Math.sqrt(sum/dataArr.length);
  var db=Math.max(0,20*Math.log10(Math.max(rms,1e-6))+100);
  if(peakDb==null||db>peakDb){
    peakDb=db;
    try{localStorage.setItem("peakDb",peakDb)}catch(e){}
  }
  var now=performance.now();
  if(now-lastFrame<100)return;
  lastFrame=now;
  lastDb=db;
  render();
}

startBtn.onclick=function(){
  startBtn.style.display="none";
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){
    msgEl.textContent="Microphone access isn't supported on this device.";
    return;
  }
  numEl.classList.add("pulse");
  msgEl.textContent="Requesting microphone…";
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    numEl.classList.remove("pulse");
    msgEl.textContent="";
    accEl.textContent="uncalibrated — relative levels only, not true SPL";
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=1024;
    dataArr=new Float32Array(analyser.fftSize);
    src.connect(analyser);
    loop();
  }).catch(function(){
    numEl.classList.remove("pulse");
    msgEl.textContent="Microphone access denied. Reset the site's microphone permission and try again.";
  });
};
</script>
</body>
</html>
