<style>
:root{color-scheme:dark light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.5rem;text-align:center;padding:1.5rem;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:#0b0f14;color:#eaf2f8;
  transition:background .4s;
}
@media (prefers-color-scheme: light){
  body{background:#f4f8fb;color:#0b0f14}
}
#icon{width:2.5rem;height:2.5rem;color:#4f8cff;margin-bottom:.25rem}
@media (prefers-color-scheme: light){
  #icon{color:#1a5fd6}
}
#num{
  font-size:min(24vw,13rem);font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  cursor:pointer;user-select:none;
  background:linear-gradient(180deg,#8ec9ff,#4f8cff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
@media (prefers-color-scheme: light){
  #num{background:linear-gradient(180deg,#1a5fd6,#0b3d91);-webkit-background-clip:text;background-clip:text}
}
#unit{font-size:1.3rem;opacity:.6;cursor:pointer;user-select:none}
#acc{font-size:.85rem;opacity:.4;min-height:1.2em}
#msg{font-size:1rem;opacity:.7;max-width:26rem}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
#start{
  margin-top:.5rem;padding:.6rem 1.4rem;border-radius:2rem;
  border:1px solid currentColor;background:transparent;color:inherit;
  font-size:1rem;cursor:pointer;opacity:.85;
}
#start:active{opacity:.5}
</style>
</head>
<body>
<svg id="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19 9 9 12.5 14 16 6 21 19Z"/><path d="M14.3 9.2h3"/></svg>
<div id="num">--</div>
<div id="unit">m</div>
<div id="acc"></div>
<div id="msg"></div>
<button id="start" type="button">Enable Location</button>
<script>
var unit="m",lastM=null,lastAcc=null,numEl=document.getElementById("num"),
    unitEl=document.getElementById("unit"),accEl=document.getElementById("acc"),
    msgEl=document.getElementById("msg"),startBtn=document.getElementById("start");

function render(){
  if(lastM==null)return;
  var v=unit==="m"?lastM:lastM*3.28084;
  numEl.textContent=Math.round(v);
  unitEl.textContent=unit==="m"?"meters":"feet";
  if(lastAcc==null){
    accEl.textContent="no accuracy data — reading may be a placeholder, not real GPS";
  }else{
    var a=unit==="m"?lastAcc:lastAcc*3.28084;
    accEl.textContent="± "+Math.round(a)+" "+(unit==="m"?"m":"ft")+" accuracy";
  }
}
function toggleUnit(){unit=unit==="m"?"ft":"m";render()}
numEl.onclick=toggleUnit;unitEl.onclick=toggleUnit;

function onSuccess(pos){
  numEl.classList.remove("pulse");
  var alt=pos.coords.altitude;
  if(alt==null){
    msgEl.textContent="This device isn't reporting altitude (common on laptops/desktops — try a phone with GPS, outdoors).";
    accEl.textContent="";
    return;
  }
  lastM=alt;
  lastAcc=pos.coords.altitudeAccuracy;
  render();
  if(lastAcc==null){
    msgEl.textContent="This looks like WiFi/IP-based location, not GPS. Try a phone outdoors for a real altitude fix.";
  }else{
    msgEl.textContent=lastAcc>75?"Low accuracy — try outdoors with a clear sky view for a better fix.":"";
  }
}
function onError(err){
  numEl.classList.remove("pulse");
  accEl.textContent="";
  if(err.code===1)msgEl.textContent="Location permission denied. Reset the site's location permission and try again.";
  else if(err.code===3)msgEl.textContent="Timed out getting a GPS fix. Try again outdoors with a clear sky view.";
  else msgEl.textContent="Position unavailable right now. Try again outdoors with a clear sky view.";
}
startBtn.onclick=function(){
  startBtn.style.display="none";
  if(!("geolocation" in navigator)){
    msgEl.textContent="Geolocation isn't supported on this device.";
    return;
  }
  numEl.classList.add("pulse");
  msgEl.textContent="Requesting location…";
  navigator.geolocation.watchPosition(onSuccess,onError,{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
};
</script>
</body>
