<style>
:root{color-scheme:dark light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.5rem;text-align:center;padding:1.5rem;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:#0b0f14;color:#eaf2f8;
  transition:background .4s;
}
@media (prefers-color-scheme: light){
  body{background:#f4f8fb;color:#0b0f14}
}
#icon{width:2.5rem;height:2.5rem;color:#4fff9d;margin-bottom:.25rem}
@media (prefers-color-scheme: light){
  #icon{color:#0b9142}
}
#num{
  font-size:min(24vw,13rem);font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  cursor:pointer;user-select:none;
  background:linear-gradient(180deg,#8effc9,#4fff9d);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
@media (prefers-color-scheme: light){
  #num{background:linear-gradient(180deg,#1ad678,#0b9142);-webkit-background-clip:text;background-clip:text}
}
#unit{font-size:1.3rem;opacity:.6;cursor:pointer;user-select:none}
#peak{font-size:1rem;opacity:.55;cursor:pointer;user-select:none;margin-top:.25rem;min-height:1.3em}
#acc{font-size:.85rem;opacity:.4;min-height:1.2em}
#msg{font-size:1rem;opacity:.7;max-width:26rem}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
#start{
  margin-top:.5rem;padding:.6rem 1.4rem;border-radius:2rem;
  border:1px solid currentColor;background:transparent;color:inherit;
  font-size:1rem;cursor:pointer;opacity:.85;
}
#start:active{opacity:.5}
</style>
</head>
<body>
<svg id="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16a7.5 7.5 0 0 1 15 0"/><line x1="12" y1="16" x2="15.5" y2="10.5"/><circle cx="12" cy="16" r="1.15" fill="currentColor" stroke="none"/></svg>
<div id="num">--</div>
<div id="unit">km/h</div>
<div id="peak"></div>
<div id="acc"></div>
<div id="msg"></div>
<button id="start" type="button">Enable Location</button>
<script>
var unit="kmh",realMs=null,prevRealMs=null,trendSign=0,displayMs=null,peakMs=null,
    lastGpsT=0,lastMotionT=0,lastFrame=0,
    numEl=document.getElementById("num"),unitEl=document.getElementById("unit"),
    peakEl=document.getElementById("peak"),accEl=document.getElementById("acc"),
    msgEl=document.getElementById("msg"),startBtn=document.getElementById("start");

try{var sp=localStorage.getItem("peakMs");if(sp!=null)peakMs=parseFloat(sp);}catch(e){}

function conv(ms){return unit==="kmh"?ms*3.6:ms*2.23694}
function render(){
  if(displayMs==null)return;
  var ms=displayMs<0.3?0:displayMs;
  numEl.textContent=Math.round(conv(ms));
  unitEl.textContent=unit==="kmh"?"km/h":"mph";
  renderPeak();
}
function renderPeak(){
  peakEl.textContent=peakMs==null?"":"peak "+Math.round(conv(peakMs))+" "+(unit==="kmh"?"km/h":"mph")+" — tap to reset";
}
function toggleUnit(){unit=unit==="kmh"?"mph":"kmh";render()}
numEl.onclick=toggleUnit;unitEl.onclick=toggleUnit;
peakEl.onclick=function(){
  peakMs=null;
  try{localStorage.removeItem("peakMs")}catch(e){}
  renderPeak();
};
renderPeak();

function onSuccess(pos){
  numEl.classList.remove("pulse");
  var acc=pos.coords.accuracy;
  accEl.textContent=acc!=null?"± "+Math.round(acc)+" m position accuracy":"";
  if(acc!=null&&acc>30){
    msgEl.textContent="Signal too weak for a reliable speed reading — try outdoors with a clear sky view.";
    return;
  }
  var spd=pos.coords.speed;
  if(spd==null){
    msgEl.textContent="This device isn't reporting speed right now (common indoors/on desktops — try outdoors while moving).";
    return;
  }
  prevRealMs=realMs;
  realMs=spd;
  lastGpsT=performance.now();
  trendSign=(prevRealMs==null||Math.abs(realMs-prevRealMs)<0.2)?0:(realMs>prevRealMs?1:-1);
  displayMs=realMs;
  if(acc!=null&&acc<=15&&(peakMs==null||spd>peakMs)){
    peakMs=spd;
    try{localStorage.setItem("peakMs",peakMs)}catch(err){}
  }
  render();
  msgEl.textContent="";
}
function onError(err){
  numEl.classList.remove("pulse");
  accEl.textContent="";
  if(err.code===1)msgEl.textContent="Location permission denied. Reset the site's location permission and try again.";
  else if(err.code===3)msgEl.textContent="Timed out getting a GPS fix. Try again outdoors with a clear sky view.";
  else msgEl.textContent="Position unavailable right now. Try again outdoors with a clear sky view.";
}
function onMotion(e){
  var a=e.acceleration;
  if(!a||a.x==null||realMs==null)return;
  var now=performance.now();
  if(lastMotionT===0){lastMotionT=now;return}
  var dt=(now-lastMotionT)/1000;
  lastMotionT=now;
  if(now-lastGpsT>3000||trendSign===0){displayMs=realMs}
  else{
    var mag=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
    displayMs=Math.max(0,displayMs+trendSign*mag*dt*0.3);
  }
  if(now-lastFrame<100)return;
  lastFrame=now;
  render();
}
function enableMotion(){
  if(!window.DeviceMotionEvent)return;
  if(typeof DeviceMotionEvent.requestPermission==="function"){
    DeviceMotionEvent.requestPermission().then(function(state){
      if(state==="granted")window.addEventListener("devicemotion",onMotion);
    }).catch(function(){});
  }else{
    window.addEventListener("devicemotion",onMotion);
  }
}
startBtn.onclick=function(){
  startBtn.style.display="none";
  if(!("geolocation" in navigator)){
    msgEl.textContent="Geolocation isn't supported on this device.";
    return;
  }
  numEl.classList.add("pulse");
  msgEl.textContent="Requesting location…";
  navigator.geolocation.watchPosition(onSuccess,onError,{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  enableMotion();
};
</script>
</body>
</html>
