<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How Steep Am I</title>
<style>
:root{color-scheme:dark light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.5rem;text-align:center;padding:1.5rem;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:#0b0f14;color:#eaf2f8;
  transition:background .4s;
}
@media (prefers-color-scheme: light){
  body{background:#f4f8fb;color:#0b0f14}
}
#num{
  font-size:min(24vw,13rem);font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  cursor:pointer;user-select:none;
  background:linear-gradient(180deg,#ffc98e,#ff8c4f);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
@media (prefers-color-scheme: light){
  #num{background:linear-gradient(180deg,#d6621a,#912a0b);-webkit-background-clip:text;background-clip:text}
}
#unit{font-size:1.3rem;opacity:.6;cursor:pointer;user-select:none}
#acc{font-size:.85rem;opacity:.4;min-height:1.2em}
#msg{font-size:1rem;opacity:.7;max-width:26rem}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
#start{
  margin-top:.5rem;padding:.6rem 1.4rem;border-radius:2rem;
  border:1px solid currentColor;background:transparent;color:inherit;
  font-size:1rem;cursor:pointer;opacity:.85;
}
#start:active{opacity:.5}
</style>
</head>
<body>
<div id="num">--</div>
<div id="unit">% grade</div>
<div id="acc"></div>
<div id="msg"></div>
<button id="start" type="button">Enable Location</button>
<script>
var MIN_DIST=20,MAX_BUF=200;
var unit="pct",lastGrade=null,lastDeg=null,buf=[],
    numEl=document.getElementById("num"),unitEl=document.getElementById("unit"),
    accEl=document.getElementById("acc"),msgEl=document.getElementById("msg"),
    startBtn=document.getElementById("start");

function dist(a,b){
  var R=6371000,toRad=Math.PI/180;
  var dLat=(b.lat-a.lat)*toRad,dLon=(b.lon-a.lon)*toRad;
  var s=Math.sin(dLat/2)*Math.sin(dLat/2)+
        Math.cos(a.lat*toRad)*Math.cos(b.lat*toRad)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}

function render(){
  if(lastGrade==null)return;
  numEl.textContent=Math.round(unit==="pct"?lastGrade:lastDeg);
  unitEl.textContent=unit==="pct"?"% grade":"degrees";
}
function toggleUnit(){unit=unit==="pct"?"deg":"pct";render()}
numEl.onclick=toggleUnit;unitEl.onclick=toggleUnit;

function onSuccess(pos){
  numEl.classList.remove("pulse");
  var c=pos.coords;
  if(c.altitude==null){
    msgEl.textContent="This device isn't reporting altitude (common on laptops/desktops — try a phone with GPS, outdoors).";
    return;
  }
  if(c.accuracy!=null&&c.accuracy>30){
    msgEl.textContent="Signal too weak right now — try outdoors with a clear sky view.";
    return;
  }
  var cur={lat:c.latitude,lon:c.longitude,alt:c.altitude};
  buf.push(cur);
  if(buf.length>MAX_BUF)buf.shift();

  var i=0;
  while(i<buf.length&&dist(buf[i],cur)<MIN_DIST)i++;
  if(i>=buf.length){
    var have=Math.round(dist(buf[0],cur));
    msgEl.textContent="Keep moving — need ~"+MIN_DIST+"m to get a reading ("+have+"m so far).";
    return;
  }
  var ref=buf[i],d=dist(ref,cur),deltaAlt=cur.alt-ref.alt;
  lastGrade=deltaAlt/d*100;
  lastDeg=Math.atan2(deltaAlt,d)*180/Math.PI;
  render();
  accEl.textContent="based on "+Math.round(d)+"m of movement";
  msgEl.textContent="";
}
function onError(err){
  numEl.classList.remove("pulse");
  accEl.textContent="";
  if(err.code===1)msgEl.textContent="Location permission denied. Reset the site's location permission and try again.";
  else if(err.code===3)msgEl.textContent="Timed out getting a GPS fix. Try again outdoors with a clear sky view.";
  else msgEl.textContent="Position unavailable right now. Try again outdoors with a clear sky view.";
}
startBtn.onclick=function(){
  startBtn.style.display="none";
  if(!("geolocation" in navigator)){
    msgEl.textContent="Geolocation isn't supported on this device.";
    return;
  }
  numEl.classList.add("pulse");
  msgEl.textContent="Requesting location…";
  navigator.geolocation.watchPosition(onSuccess,onError,{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
};
</script>
</body>
</html>
